name: Build modified eIsland locally

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/manual-local-build.yml

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows x64 installer
    # node-gyp 11 does not recognize the Visual Studio 2026 installation on
    # windows-latest yet. Pin VS 2022 so the four N-API C++ plugins can build.
    runs-on: windows-2022
    timeout-minutes: 90

    steps:
      - name: Checkout modified source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: npm

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Verify Visual Studio C++ toolchain
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installation = & $vswhere -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          if (-not $installation) {
            throw "Visual Studio C++ x64 tools are unavailable on this runner."
          }
          Write-Host "Using Visual Studio: $installation"

      - name: Install JavaScript dependencies without native scripts
        run: npm ci --ignore-scripts

      - name: Install Electron and FFmpeg runtime files
        shell: pwsh
        env:
          FFMPEG_BINARIES_URL: https://cdn.npmmirror.com/binaries/ffmpeg-static
        run: |
          node node_modules/electron/install.js
          node node_modules/ffmpeg-static/install.js

      - name: Build Bluetooth plugin
        id: build_bluetooth
        continue-on-error: true
        shell: pwsh
        env:
          npm_config_msvs_version: 2022
        run: npm run plugin:build:bluetooth

      - name: Build brightness plugin
        id: build_brightness
        continue-on-error: true
        shell: pwsh
        env:
          npm_config_msvs_version: 2022
        run: npm run plugin:build:brightness

      - name: Build volume plugin
        id: build_volume
        continue-on-error: true
        shell: pwsh
        env:
          npm_config_msvs_version: 2022
        run: npm run plugin:build:volume

      - name: Build power plugin
        id: build_power
        continue-on-error: true
        shell: pwsh
        env:
          npm_config_msvs_version: 2022
        run: npm run plugin:build:power

      - name: Build processes plugin
        id: build_processes
        continue-on-error: true
        shell: pwsh
        env:
          npm_config_msvs_version: 2022
        run: npm run plugin:build:processes

      - name: Build SMTC plugin
        id: build_smtc
        continue-on-error: true
        shell: pwsh
        env:
          npm_config_msvs_version: 2022
        run: npm run plugin:build:smtc

      - name: Build toast plugin
        id: build_toast
        continue-on-error: true
        shell: pwsh
        env:
          npm_config_msvs_version: 2022
        run: npm run plugin:build:toast

      - name: Build Wi-Fi plugin
        id: build_wifi
        continue-on-error: true
        shell: pwsh
        env:
          npm_config_msvs_version: 2022
        run: npm run plugin:build:wifi

      - name: Build fullscreen plugin
        id: build_fullscreen
        continue-on-error: true
        shell: pwsh
        env:
          npm_config_msvs_version: 2022
        run: npm run plugin:build:fullscreen

      - name: Build performance monitor plugin
        id: build_perfmon
        continue-on-error: true
        shell: pwsh
        env:
          npm_config_msvs_version: 2022
        run: npm run plugin:build:perfmon

      - name: Build application icon plugin
        id: build_icon
        continue-on-error: true
        shell: pwsh
        env:
          npm_config_msvs_version: 2022
        run: npm run plugin:build:icon-helper

      - name: Build screenshot plugin
        id: build_screenshot
        continue-on-error: true
        shell: pwsh
        env:
          npm_config_msvs_version: 2022
        run: npm run plugin:build:screenshot-helper

      - name: Report failed native plugins
        shell: pwsh
        run: |
          $outcomes = @{
            bluetooth = "${{ steps.build_bluetooth.outcome }}"
            brightness = "${{ steps.build_brightness.outcome }}"
            volume = "${{ steps.build_volume.outcome }}"
            power = "${{ steps.build_power.outcome }}"
            processes = "${{ steps.build_processes.outcome }}"
            smtc = "${{ steps.build_smtc.outcome }}"
            toast = "${{ steps.build_toast.outcome }}"
            wifi = "${{ steps.build_wifi.outcome }}"
            fullscreen = "${{ steps.build_fullscreen.outcome }}"
            perfmon = "${{ steps.build_perfmon.outcome }}"
            icon = "${{ steps.build_icon.outcome }}"
            screenshot = "${{ steps.build_screenshot.outcome }}"
          }
          $failed = @($outcomes.GetEnumerator() |
            Where-Object { $_.Value -ne "success" } |
            ForEach-Object { $_.Key })
          if ($failed.Count -gt 0) {
            $names = $failed -join ", "
            Write-Host "::error title=Native plugin builds failed::$names"
            throw "Native plugin builds failed: $names"
          }

      - name: Verify required native outputs
        shell: pwsh
        run: |
          $appIconDll = Get-ChildItem `
            "plugins/eisland-windows-application-icon-helper/src/bin/Release" `
            -Recurse -File -Filter "eIslandAppIconHelper.dll" |
            Where-Object { $_.FullName -match '[\\/]win-x64[\\/]' } |
            Select-Object -First 1
          if (-not $appIconDll) {
            throw "Required eIslandAppIconHelper.dll x64 output is missing."
          }
          Write-Host "App icon helper: $($appIconDll.FullName)"

          $nativeFiles = Get-ChildItem plugins -Recurse -File |
            Where-Object { $_.Extension -in ".dll", ".node", ".exe" }
          if ($nativeFiles.Count -lt 10) {
            throw "Only $($nativeFiles.Count) native files were built; expected at least 10."
          }
          $nativeFiles | ForEach-Object {
            Write-Host "$($_.Length) $($_.FullName)"
          }

      - name: Build Windows installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run package

      - name: Verify installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem dist -Filter "*-Setup.exe" |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $installer) {
            throw "Windows installer was not generated."
          }
          $hash = Get-FileHash -Algorithm SHA256 $installer.FullName
          Write-Host "Installer: $($installer.FullName)"
          Write-Host "Size: $($installer.Length)"
          Write-Host "SHA256: $($hash.Hash)"

      - name: Upload private workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: eIsland-local-windows-x64
          path: |
            dist/*-Setup.exe
            dist/*.blockmap
            dist/latest.yml
          if-no-files-found: error
          retention-days: 7
